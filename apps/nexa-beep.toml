# Nexa Beep — pkg.sosomlab.com 등록 파일(apps/nexa-clip.toml과 같은 모양 · docs/ADDING-AN-APP.md)
#
# 저장소 생성기(scripts/build_repo.py)는 SosomLab/nexa-beep의 최신 정식 릴리스에서 아래 자산을 찾아
# 색인을 만들고, 패키지 파일 자체는 GitHub Release로 302 리다이렉트한다.
# ⚠️ 한 번 발행한 Release 자산은 지우거나 다시 올리지 않는다 — 서명된 색인의 해시가 그 파일을 가리킨다.

package = "nexa-beep"            # apt/dnf 패키지 이름(.deb Package · .rpm Name과 같다)
github = "SosomLab/nexa-beep"    # 릴리스를 가져올 저장소(클라이언트 태그 v<버전> · 서버 beepd-v*는 제외)
tag_prefix = "v"                 # 태그 = v<버전>
summary = "Zero-config local network messenger — peers on the same LAN appear automatically"

# 자산 이름 규칙 — {version}은 태그에서 tag_prefix를 뗀 값(nexa-beep release.yml · packaging/linux).
[deb]
amd64 = "nexa-beep-{version}-linux-x64.deb"

# RPM — v0.3.0부터 릴리스에 올라간다(.rpm Name = nexa-beep).
[rpm]
x86_64 = "nexa-beep-{version}-linux-x64.rpm"
