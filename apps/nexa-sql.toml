# Nexa SQL — pkg.sosomlab.com 등록 파일(모양 = apps/nexa-clip.toml · 규칙 = docs/ADDING-AN-APP.md)
#
# 앱 쪽 발행 신호 = SosomLab/nexa-sql `.github/workflows/linux-repo.yml`(릴리스 공개 때 app-released).
# 자산 이름을 바꾸면 그 워크플로의 자산 확인 줄도 함께 바꾼다.
#
# ⚠️ 한 번 발행한 Release 자산은 지우거나 다시 올리지 않는다 — 서명된 색인의 해시가 그 파일을 가리킨다.

package = "nexa-sql"             # apt/dnf 패키지 이름(.deb Package · .rpm Name과 같다)
github = "SosomLab/nexa-sql"     # 릴리스를 가져올 저장소
tag_prefix = "v"                 # 태그 = v<버전>
summary = "Lightweight cross-platform SQL client (IDE) with the nsql CLI"

# 자산 이름 규칙 — {version}은 태그에서 tag_prefix를 뗀 값(packaging/linux/build-deb.sh · build-rpm.sh의 산출 이름).
[deb]
amd64 = "nexa-sql_{version}_amd64.deb"

# RPM — v0.1.0부터 릴리스에 들어 있다(rpmbuild · Release 1).
[rpm]
x86_64 = "nexa-sql-{version}-1.x86_64.rpm"
