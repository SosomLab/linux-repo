# pkg.sosomlab.com 발행 — 등록된 앱(apps/*.toml)의 최신 릴리스로 서명된 저장소를 만들어 Cloudflare Pages에 배포한다.
#
# 언제 도나:
#   - 수동 실행(Actions → publish → Run workflow)
#   - 앱 릴리스가 끝났다는 신호(repository_dispatch · event_type: app-released) — 앱 저장소 release 워크플로가 보낸다
#   - 하루 한 번(신호를 놓쳤을 때의 안전망 · 바뀐 버전이 없으면 배포를 건너뛴다)
#
# 기록(실행 화면 Summary):
#   - 요청 기록 — 무엇이 실행을 일으켰나 · 외부 신호면 보낸 쪽이 실은 client_payload(app · tag · repo · run_url)
#   - 진행 기록 — 단계별 결과 · 버전 변화(요청 시점 → 이번 생성) · 배포 여부
#   실행 목록에서도 외부 요청이 구분되게 실행 이름에 요청 앱을 붙인다.
#
# 필요한 시크릿(Settings → Secrets and variables → Actions):
#   LINUX_REPO_GPG_PRIVATE_KEY  서명 개인 키(armor 전문 · docs/KEYS.md)
#   CLOUDFLARE_API_TOKEN        Pages 편집 권한 토큰(docs/SETUP.md 4단계)
#   CLOUDFLARE_ACCOUNT_ID       Cloudflare 계정 ID
name: publish
run-name: >-
  ${{ github.event_name == 'repository_dispatch'
      && format('publish · 외부 요청 · {0} {1}', github.event.client_payload.app || '앱 미지정', github.event.client_payload.tag)
      || format('publish · {0}', github.event_name) }}

on:
  workflow_dispatch:
  repository_dispatch:
    types: [app-released]
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 요청 기록
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          curl -fsS https://pkg.sosomlab.com/repo.json -o "$RUNNER_TEMP/before.json" || echo '{}' > "$RUNNER_TEMP/before.json"
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os
          from datetime import datetime, timedelta, timezone

          def cell(v):
              return str(v).replace("|", "\\|").replace("\n", " ")

          event = os.environ["EVENT"]
          kind = {"repository_dispatch": "외부 신호(repository_dispatch)", "workflow_dispatch": "수동 실행", "schedule": "정기 실행"}.get(event, event)
          payload = json.loads(os.environ.get("PAYLOAD") or "null")
          if payload is not None and not isinstance(payload, dict):
              payload = {"payload": payload}
          now = datetime.now(timezone(timedelta(hours=9))).strftime("%Y-%m-%d %H:%M:%S KST")
          rows = [("종류", kind), ("실행 주체", os.environ["ACTOR"]), ("접수 시각", now)]
          rows += [(f"요청 `{k}`", v) for k, v in (payload or {}).items()]
          if event == "repository_dispatch" and not payload:
              rows.append(("요청 내용", "client_payload 없음 — 보낸 쪽을 알 수 없다"))
          print("## 요청 기록\n")
          print("| 항목 | 값 |\n| --- | --- |")
          for k, v in rows:
              print(f"| {k} | {cell(v)} |")
          print()
          EOF

      - uses: actions/checkout@v4

      # ★ 미등록 앱 탐지(10-09 — nexa-beep이 .deb를 릴리스하면서 여기 등록이 빠져 `apt install`이 옛 버전에 머문 사고):
      #   조직 공개 저장소의 최신 릴리스에 .deb/.rpm이 있는데 apps/*.toml에 없으면 ::warning:: + 요약 표. 발행은 막지 않는다.
      - name: 미등록 앱 점검
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_unregistered.py

      - name: 서명 키 가져오기
        id: key
        env:
          KEY: ${{ secrets.LINUX_REPO_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$KEY" || { echo "::error::LINUX_REPO_GPG_PRIVATE_KEY 시크릿이 없다"; exit 1; }
          printf '%s\n' "$KEY" | gpg --batch --import
          fpr=$(gpg --with-colons --list-secret-keys | awk -F: '/^fpr/{print $10; exit}')
          echo "LINUX_REPO_KEY=$fpr" >> "$GITHUB_ENV"
          echo "서명 키: $fpr"

      - name: RPM 도구(등록 앱 중 [rpm]이 있을 때만)
        id: rpm
        run: |
          if grep -qx '\[rpm\]' apps/*.toml; then sudo apt-get update -q && sudo apt-get install -y -q createrepo-c; fi

      - name: 저장소 생성
        id: build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build_repo.py --out public

      - name: 바뀐 것이 있나(정기 실행일 때만 판정)
        id: diff
        run: |
          set -euo pipefail
          change=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            live=$(curl -fsS https://pkg.sosomlab.com/repo.json || echo '{}')
            if [ "$(echo "$live" | python3 -c 'import sys,json;print(json.dumps(json.load(sys.stdin).get("apps"),sort_keys=True))')" = \
                 "$(python3 -c 'import json;print(json.dumps(json.load(open("public/repo.json"))["apps"],sort_keys=True))')" ]; then
              change=false
            fi
          fi
          echo "change=$change" >> "$GITHUB_OUTPUT"
          echo "배포 필요: $change"

      - name: Cloudflare Pages 배포
        id: deploy
        if: steps.diff.outputs.change == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=linux-repo --branch=main --commit-dirty=true

      - name: 배포 확인
        id: verify
        if: steps.diff.outputs.change == 'true'
        run: |
          set -euo pipefail
          sleep 20
          curl -fsS https://pkg.sosomlab.com/repo.json
          curl -fsSI https://pkg.sosomlab.com/apt/dists/stable/InRelease | head -n 5

      - name: 진행 기록
        if: always()
        env:
          S_KEY: ${{ steps.key.outcome }}
          S_RPM: ${{ steps.rpm.outcome }}
          S_BUILD: ${{ steps.build.outcome }}
          S_DIFF: ${{ steps.diff.outcome }}
          S_DEPLOY: ${{ steps.deploy.outcome }}
          S_VERIFY: ${{ steps.verify.outcome }}
          CHANGE: ${{ steps.diff.outputs.change }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          def versions(path):
              try:
                  return {a["package"]: a["version"] for a in json.loads(Path(path).read_text()).get("apps") or []}
              except (OSError, ValueError, KeyError, TypeError):
                  return None

          mark = {"success": "✅ 성공", "failure": "❌ 실패", "skipped": "⏭️ 건너뜀", "cancelled": "🚫 취소"}
          steps = [("서명 키 가져오기", "S_KEY"), ("RPM 도구", "S_RPM"), ("저장소 생성", "S_BUILD"),
                   ("바뀐 것 판정", "S_DIFF"), ("Cloudflare Pages 배포", "S_DEPLOY"), ("배포 확인", "S_VERIFY")]
          print("## 진행 기록\n")
          print("| 단계 | 결과 |\n| --- | --- |")
          for name, env in steps:
              outcome = os.environ.get(env, "")
              print(f"| {name} | {mark.get(outcome, outcome or '⏭️ 건너뜀')} |")
          print()

          before = versions(Path(os.environ["RUNNER_TEMP"]) / "before.json") or {}
          after = versions("public/repo.json")
          if after is None:
              print("저장소가 생성되지 않았다 — 위 표에서 실패한 단계의 로그를 본다.")
          else:
              print("| 패키지 | 요청 시점 | 이번 생성 |\n| --- | --- | --- |")
              for pkg in sorted(after):
                  old = before.get(pkg, "(없음)")
                  print(f"| {pkg} | {old} | {after[pkg]}{'' if old == after[pkg] else ' 🆕'} |")
          print()
          if os.environ.get("S_VERIFY") == "success":
              print(f"배포 완료 — {os.environ.get('DEPLOY_URL') or 'https://pkg.sosomlab.com/'}")
          elif os.environ.get("CHANGE") == "false":
              print("바뀐 버전이 없어 배포를 건너뛰었다.")
          else:
              print("배포되지 않았다.")
          print(f"\n종료 시각: {datetime.now(timezone(timedelta(hours=9))).strftime('%Y-%m-%d %H:%M:%S KST')}")
          EOF
